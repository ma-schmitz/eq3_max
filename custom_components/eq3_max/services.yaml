set_away:
  target:
    entity:
      integration: eq3_max
      domain: climate
  fields:
    temperature:
      required: false
      selector:
        number:
          min: 4.5
          max: 30.5
          step: 0.5
          unit_of_measurement: "°C"
    until:
      required: true
      example: "2026-10-12 18:00:00"
      selector:
        datetime:

factory_reset:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: eq3_max

link:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: eq3_max
    partner_device_id:
      required: true
      selector:
        device:
          integration: eq3_max

unlink:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: eq3_max
    partner_device_id:
      required: true
      selector:
        device:
          integration: eq3_max

# Projektseite (Material for MkDocs). Lokal: .venv-docs/bin/mkdocs serve
# Veröffentlicht wird sie auf GitHub Pages (.github/workflows/pages.yml).
site_name: eq3_max
site_description: eQ-3 MAX! directly in Home Assistant – through a CUL stick or a flashed Cube, without Homegear.
# Account des öffentlichen Repos (GitHub-Export: tools/github_export.py).
site_url: https://ma-schmitz.github.io/eq3_max/
repo_url: https://github.com/ma-schmitz/eq3_max
repo_name: eq3_max
edit_uri: ""
docs_dir: website
exclude_docs: |
  hooks.py
  overrides/
  __pycache__/
copyright: eq3_max – Home Assistant integration for eQ-3 MAX!

theme:
  name: material
  language: en
  custom_dir: website/overrides
  logo: assets/icon.png
  favicon: assets/icon.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

hooks:
  - website/hooks.py

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search:
      lang: [en, de]
  # Zweisprachig: Englisch unter /, Deutsch unter /de/; deutsche Seiten heißen *.de.md.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: de
          name: Deutsch
          build: true
          site_description: eQ-3 MAX! direkt in Home Assistant – über einen CUL-Stick oder geflashten Cube, ohne Homegear.
          copyright: eq3_max – Home-Assistant-Integration für eQ-3 MAX!
          theme:
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-night
                  name: Dunkles Design
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-sunny
                  name: Helles Design
          nav_translations:
            Home: Start
            "What's new in 0.8": Neu in 0.8
            Thermostat card: Thermostatkarte
            Getting started: Loslegen
            Installation: Installation
            Setup: Einrichtung
            Hardware: Hardware
            Migration: Umstieg
            From Homegear: Von Homegear
            Manual: Handbuch
            Operating a thermostat: Thermostat bedienen
            Device configuration: Gerätekonfiguration
            Links: Verknüpfungen
            The "eQ-3 MAX!" panel: Seite „eQ-3 MAX!“
            Multiple radio modules: Mehrere Funkmodule
            Pairing devices: Geräte anlernen
            Services: Dienste
            Operation and faults: Betrieb und Störungen
  # Schriften und andere externe Dateien beim Bauen herunterladen und selbst ausliefern
  # (keine Verbindung zu Google beim Besuch der Seite).
  - privacy

nav:
  - Home: index.md
  - What's new in 0.8: neu.md
  - Getting started:
      - Installation: loslegen/installation.md
      - Setup: loslegen/einrichtung.md
      - Hardware: loslegen/hardware.md
  - Migration:
      - umstieg/index.md
      - From Homegear: umstieg/homegear.md
  - Manual:
      - handbuch/index.md
      - Operating a thermostat: handbuch/bedienung.md
      - Device configuration: handbuch/konfiguration.md
      - Links: handbuch/verknuepfungen.md
      - The "eQ-3 MAX!" panel: handbuch/seite.md
      - Thermostat card: handbuch/karte.md
      - Multiple radio modules: handbuch/funkmodule.md
      - Pairing devices: handbuch/anlernen.md
      - Services: handbuch/dienste.md
      - Operation and faults: handbuch/betrieb.md
  - FAQ: faq.md
  - Changelog: changelog.md
